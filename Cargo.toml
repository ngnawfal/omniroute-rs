[workspace]
resolver = "2"
members = [
    "crates/omni-types",
    "crates/omni-catalog",
    "crates/omni-store",
    "crates/omni-router",
    "crates/omni-translate",
    "crates/omni-exec",
    "crates/omni-server",
    "crates/omni-guard",
    "crates/omni-gami",
    "crates/omni-mcp",
    "crates/omni-mitm",
    "crates/omni-compress",
    "crates/omni-cache",
    "crates/omni-oauth",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json", "gzip"] }
futures-util = "0.3"
futures-core = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
rusqlite = { version = "0.33", features = ["bundled", "serde_json"] }
thiserror = "2"
anyhow = "1"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
